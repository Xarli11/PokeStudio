name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate pinned workflow syntax and shell syntax
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
          for file in scripts/*.sh; do bash -n "$file"; done
  node:
    name: Node — validate full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm validate:full
  database:
    name: Isolated database — migrations, persistence, lock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start disposable Supabase on this runner only
        run: pnpm --filter @pokestudio/database exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Check migration replay
        run: pnpm --filter @pokestudio/database exec supabase db reset --local --no-seed
      - run: node scripts/ci/integration-env.mjs
      - name: PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Read-only release queries through real psql
        run: node scripts/ci/postgres.integration.mjs
      - name: Persistence and session lock integration tests
        run: pnpm --filter @pokestudio/pokemon-data exec vitest run tests/persist.integration.test.ts tests/ingest-lock.integration.test.ts
      - name: Stop disposable database
        if: always()
        run: pnpm --filter @pokestudio/database exec supabase stop --no-backup
  python:
    name: Python research lane — lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest
  required:
    name: CI required
    if: always()
    needs: [workflows, node, database, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'
