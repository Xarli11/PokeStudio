name: Cloud DEV
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_ingest:
        description: Refresh all upstream data (about 35 minutes)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# Own the environment through preparation, deployment and smoke. Pending runs may
# be replaced; the data diff always starts at the last successful delivery.
concurrency:
  group: delivery-cloud-dev
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deliver:
    needs: validate
    uses: ./.github/workflows/release.yml
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_INGEST_KEY: ${{ secrets.SUPABASE_INGEST_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      target: cloud-dev
      force_ingest: ${{ inputs.force_ingest || false }}
