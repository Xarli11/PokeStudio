name: Production
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of current main, already delivered successfully to Cloud DEV
        type: string
        required: true
      confirmation:
        description: 'Type production:<full SHA> to request approval'
        type: string
        required: true
      force_ingest:
        description: Refresh all upstream data (requires approval with this release)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: delivery-production
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deliver:
    needs: validate
    uses: ./.github/workflows/release.yml
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_INGEST_KEY: ${{ secrets.SUPABASE_INGEST_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      target: production
      candidate: ${{ inputs.candidate }}
      confirmation: ${{ inputs.confirmation }}
      force_ingest: ${{ inputs.force_ingest }}
