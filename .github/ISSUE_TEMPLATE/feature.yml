name: Feature request
description: Propose a product or engineering improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is currently missing or awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: markdown
    attributes:
      value: |
        PokeLab is community-informed but owner-led (docs/community/COMMUNITY.md). Feedback is weighted heavily but roadmap decisions remain with the project owner.
